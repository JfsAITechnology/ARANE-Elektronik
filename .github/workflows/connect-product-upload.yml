name: Connect product upload

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-product-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add product upload script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="product-upload.js"></script>'
          if tag not in s:
              marker = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
              if marker not in s:
                  raise SystemExit('Supabase script marker not found')
              s = s.replace(marker, marker + '\n' + tag, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit connection if changed
        run: |
          git config user.name 'JFS AI Technology'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Connect product photo upload to Supabase'
          git push
